[package]
name = "marmot-cli"
version = "0.2.1"
edition = "2021"
description = "CLI tool for Marmot/Whitenoise E2E encrypted messaging over Nostr"

[dependencies]
# Use same MDK version as Whitenoise for compatibility
# Updated 2026-02-16: rev 1517b34a includes critical split-brain fix (PR #179)
mdk-core = { git = "https://github.com/parres-hq/mdk", rev = "1517b34a148cf1b98872f7205505ff164ec03304" }
mdk-sqlite-storage = { git = "https://github.com/parres-hq/mdk", rev = "1517b34a148cf1b98872f7205505ff164ec03304" }
mdk-storage-traits = { git = "https://github.com/parres-hq/mdk", rev = "1517b34a148cf1b98872f7205505ff164ec03304" }
# Match nostr versions with MDK (0.44)
nostr = { version = "0.44", features = ["std", "nip44", "nip59"] }
nostr-sdk = { version = "0.44", features = ["nip59"] }
# NIP-46 remote signing
nostr-connect = "0.44"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[dev-dependencies]
tempfile = "3"
